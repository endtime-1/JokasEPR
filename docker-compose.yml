services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: jokas_dev_root
      MYSQL_DATABASE: jokas_erp
      MYSQL_USER: jokas
      MYSQL_PASSWORD: jokas_dev_password
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "jokas", "-pjokas_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4001:4001"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mysql_data:
