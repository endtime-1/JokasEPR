packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@nestjs/core': true
  '@next/swc-darwin-arm64': true
  '@next/swc-darwin-x64': true
  '@next/swc-linux-arm64-gnu': true
  '@next/swc-linux-arm64-musl': true
  '@next/swc-linux-x64-gnu': true
  '@next/swc-linux-x64-musl': true
  '@next/swc-win32-arm64-msvc': true
  '@next/swc-win32-x64-msvc': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  napi-postinstall: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@next/swc-darwin-arm64"
  - "@next/swc-darwin-x64"
  - "@next/swc-linux-arm64-gnu"
  - "@next/swc-linux-arm64-musl"
  - "@next/swc-linux-x64-gnu"
  - "@next/swc-linux-x64-musl"
  - "@next/swc-win32-arm64-msvc"
  - "@next/swc-win32-x64-msvc"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "napi-postinstall"
  - "prisma"
  - "sharp"
  - "unrs-resolver"

overrides:
  '@types/react': '^19.0.0'
  '@types/react-dom': '^19.0.0'
  # @nestjs/platform-express@10.4.22 pins multer@2.0.2 (3 open HIGH DoS
  # advisories) as its own transitive dependency, independent of apps/api's
  # direct multer@^2.2.0 — pnpm's isolated node_modules means Nest's
  # FileInterceptor (used on 2 authenticated + 1 unauthenticated public
  # upload endpoint) resolved the vulnerable version regardless. Force it.
  multer: '^2.2.0'
  # next@15.5.23 pulls sharp@0.34.5 (inherited libvips CVEs) for its image
  # optimization pipeline, used on web + storefront. Force the fixed line.
  sharp: '^0.35.0'
  # @nestjs/config pins lodash@4.17.21 (Code Injection via _.template,
  # CVE-2020-8203-class) while every other dependency in the tree already
  # resolves the fixed 4.18.1 — force the older resolution up to match.
  lodash: '^4.18.1'

patchedDependencies:
  esbuild@0.28.1: patches/esbuild@0.28.1.patch
