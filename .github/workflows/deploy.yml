name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install all dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @jokas/db prisma:generate

      - name: Build shared package
        run: pnpm --filter @jokas/shared build

      - name: Build API
        run: pnpm --filter @jokas/api build

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Web
        run: pnpm --filter @jokas/web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Storefront
        run: pnpm --filter @jokas/storefront build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      # Create standalone deploy bundles with only production deps
      - name: Bundle API for deployment
        run: |
          pnpm --filter @jokas/api deploy --prod --legacy /tmp/api-deploy
          cp -r apps/api/dist /tmp/api-deploy/dist

          # pnpm deploy copies @prisma/client from the npm store (pre-generate stub).
          # We must overwrite it with the generated version so enums like AuditAction exist.
          for CANDIDATE in \
            "packages/db/node_modules/@prisma/client" \
            "node_modules/@prisma/client"; do
            if [ -f "$CANDIDATE/index.js" ]; then PRISMA_PKG="$CANDIDATE"; break; fi
          done
          if [ -n "$PRISMA_PKG" ]; then
            echo "Copying generated @prisma/client from $PRISMA_PKG"
            rm -rf /tmp/api-deploy/node_modules/@prisma/client
            cp -rL "$PRISMA_PKG" /tmp/api-deploy/node_modules/@prisma/client
            mkdir -p /tmp/api-deploy/dist/prisma-client
            cp -rL "$PRISMA_PKG/." /tmp/api-deploy/dist/prisma-client/
          else
            echo "ERROR: generated @prisma/client not found"; exit 1
          fi

          # Copy the .prisma/client runtime (native query engine binary)
          # Search broadly — pnpm may place it anywhere in node_modules tree
          PRISMA_RUNTIME=$(find . -path "*/.prisma/client" -type d 2>/dev/null \
            | grep -v ".git" | head -1)
          if [ -z "$PRISMA_RUNTIME" ]; then
            # Fallback: find by binary filename
            BINARY=$(find . \( -name "*rhel-openssl*" -o -name "libquery_engine*" \) \
              2>/dev/null | grep -v ".git" | head -1)
            [ -n "$BINARY" ] && PRISMA_RUNTIME=$(dirname "$BINARY")
          fi
          echo "Prisma runtime: ${PRISMA_RUNTIME:-NOT FOUND}"
          if [ -n "$PRISMA_RUNTIME" ]; then
            mkdir -p /tmp/api-deploy/node_modules/.prisma
            rm -rf /tmp/api-deploy/node_modules/.prisma/client
            cp -rL "$PRISMA_RUNTIME" /tmp/api-deploy/node_modules/.prisma/client
            mkdir -p /tmp/api-deploy/dist/prisma-runtime
            cp -rL "$PRISMA_RUNTIME/." /tmp/api-deploy/dist/prisma-runtime/
          else
            echo "ERROR: Prisma runtime not found — API will crash"; exit 1
          fi

      - name: Bundle Web for deployment
        run: |
          pnpm --filter @jokas/web deploy --prod --legacy /tmp/web-deploy
          cp -r apps/web/.next /tmp/web-deploy/.next
          cp -r apps/web/public /tmp/web-deploy/public 2>/dev/null || true
          # Standalone mode: server.js lives at .next/standalone/apps/web/server.js
          # and resolves static files via __dirname/.next/static — copy them there
          mkdir -p /tmp/web-deploy/.next/standalone/apps/web/.next
          cp -r apps/web/.next/static /tmp/web-deploy/.next/standalone/apps/web/.next/static
          cp -r apps/web/public /tmp/web-deploy/.next/standalone/apps/web/public 2>/dev/null || true

      - name: Bundle Storefront for deployment
        run: |
          pnpm --filter @jokas/storefront deploy --prod --legacy /tmp/storefront-deploy
          cp -r apps/storefront/.next /tmp/storefront-deploy/.next
          cp -r apps/storefront/public /tmp/storefront-deploy/public 2>/dev/null || true
          mkdir -p /tmp/storefront-deploy/.next/standalone/apps/storefront/.next
          cp -r apps/storefront/.next/static /tmp/storefront-deploy/.next/standalone/apps/storefront/.next/static
          cp -r apps/storefront/public /tmp/storefront-deploy/.next/standalone/apps/storefront/public 2>/dev/null || true

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.HOSTINGER_SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Connection-keeping options so rsync doesn't time out mid-transfer
          cat > ~/.ssh/config << 'EOF'
          Host *
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF

      - name: Upload API to Hostinger
        run: |
          for attempt in 1 2 3; do
            rsync -avz --partial --timeout=300 \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
              /tmp/api-deploy/ \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/jokasfarms.com/nodejs/apps/api/ \
              && { echo "API upload succeeded on attempt $attempt"; break; } \
              || { echo "Attempt $attempt failed; retrying in 15s..."; sleep 15; }
          done

      - name: Upload Web to Hostinger
        run: |
          for attempt in 1 2 3; do
            rsync -avz --partial --timeout=300 --no-perms --omit-dir-times \
              --exclude='.next/cache' \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
              /tmp/web-deploy/ \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/jokasfarms.com/nodejs/apps/web/ \
              && { echo "Web upload succeeded on attempt $attempt"; break; } \
              || { echo "Attempt $attempt failed; retrying in 15s..."; sleep 15; }
          done

      - name: Upload Storefront to Hostinger
        run: |
          for attempt in 1 2 3; do
            rsync -avz --partial --timeout=300 --no-perms --omit-dir-times \
              --exclude='.next/cache' \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
              /tmp/storefront-deploy/ \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/jokasfarms.com/nodejs/apps/storefront/ \
              && { echo "Storefront upload succeeded on attempt $attempt"; break; } \
              || { echo "Attempt $attempt failed; retrying in 15s..."; sleep 15; }
          done

      - name: Upload DB migrations and scripts
        run: |
          for attempt in 1 2 3; do
            rsync -avz --partial --timeout=120 \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
              packages/db/prisma/ \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/jokasfarms.com/nodejs/prisma/ \
            && rsync -avz --partial --timeout=120 \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
              packages/db/scripts/sync-permissions.mjs \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/jokasfarms.com/nodejs/apps/api/sync-permissions.mjs \
            && { echo "DB+scripts upload succeeded on attempt $attempt"; break; } \
            || { echo "Attempt $attempt failed; retrying in 20s..."; sleep 20; }
          done

      - name: Upload root startup files
        run: |
          for attempt in 1 2 3; do
            rsync -avz --partial --timeout=120 \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
              ecosystem.config.js start.js web-worker-wrapper.js package.json \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/jokasfarms.com/nodejs/ \
            && { echo "Root files upload succeeded on attempt $attempt"; break; } \
            || { echo "Attempt $attempt failed; retrying in 20s..."; sleep 20; }
          done

      - name: Deploy and restart on Hostinger
        run: |
          REMOTE_CMD='
            set -e
            source ~/.bashrc 2>/dev/null || source ~/.profile 2>/dev/null || true
            # Load nvm — .bashrc nvm setup is skipped in non-interactive SSH shells
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" 2>/dev/null || true
            nvm use default 2>/dev/null || nvm use node 2>/dev/null || true
            # If nvm loaded but PATH not updated, find node directly in nvm tree
            if ! command -v node >/dev/null 2>&1; then
              _NBIN=$(ls "$HOME"/.nvm/versions/node/*/bin/node 2>/dev/null | sort -V | tail -1)
              [ -n "$_NBIN" ] && export PATH="$(dirname "$_NBIN"):$PATH"
            fi
            # Also try common system paths and Hostinger/Plesk paths
            # /opt/alt/alt-nodejs22 is the confirmed Hostinger Node22 path (from ps aux output)
            for p in /opt/alt/alt-nodejs22/root/usr/bin /usr/local/bin /usr/bin /usr/local/sbin /opt/plesk/node18/bin /opt/plesk/node20/bin; do
              [ -x "$p/node" ] && export PATH="$p:$PATH" && break
            done
            # Last resort: find any node binary on the filesystem
            if ! command -v node >/dev/null 2>&1; then
              _FOUND=$(find /opt /usr/local /usr/bin -maxdepth 5 -name "node" -type f -executable 2>/dev/null | head -1)
              [ -n "$_FOUND" ] && export PATH="$(dirname "$_FOUND"):$PATH"
            fi
            APP_DIR=~/domains/jokasfarms.com/nodejs

            echo "==> Backing up current deploy for rollback..."
            if [ -d $APP_DIR/apps/api/dist ]; then
              rm -rf $APP_DIR/../nodejs_prev
              # Use hard-links (cp -al) — instant, no disk duplication, no I/O spike.
              # Hardlinks point to original inodes; rsync overwrites create new inodes
              # so nodejs_prev retains the pre-deploy content for rollback.
              cp -al $APP_DIR $APP_DIR/../nodejs_prev && echo "Backup complete (hardlinks)." \
                || echo "WARNING: hardlink backup failed, skipping (continuing deploy)."
            fi

            echo "==> Running database migrations..."
            cd $APP_DIR
            # Source .env so DATABASE_URL is available in this SSH session
            # (Hostinger env-panel vars are only injected by Passenger, not SSH)
            if [ -f "$APP_DIR/.env" ]; then
              set -a; . "$APP_DIR/.env"; set +a
              echo "Sourced $APP_DIR/.env for DATABASE_URL"
            fi
            # Use the Prisma CLI bundled with the already-deployed API rather than
            # downloading via npx (npx is not always in PATH in non-interactive SSH).
            PRISMA_BIN="$APP_DIR/apps/api/node_modules/.bin/prisma"
            NODE_BIN=$(command -v node 2>/dev/null || echo "/opt/alt/alt-nodejs22/root/usr/bin/node")
            echo "node: ${NODE_BIN:-NOT FOUND}  prisma: $([ -x "$PRISMA_BIN" ] && echo found || echo NOT FOUND)"
            if [ -n "$NODE_BIN" ] && [ -x "$PRISMA_BIN" ]; then
              # The original 20260701000000_leave_request_system migration used PostgreSQL
              # DDL (CREATE TYPE, UUID, gen_random_uuid()) which MySQL rejected. Prisma
              # marks it as FAILED in _prisma_migrations, which blocks every subsequent
              # migration from running. Resolve it as --applied so migrate deploy can
              # proceed to run migrations 10-16. The actual MySQL-compatible table is
              # created by 20260730000001_leave_request_mysql_fix (IF NOT EXISTS).
              echo "Resolving blocked migrations..."
              # 20260629000001: used PostgreSQL DO $$ block / gen_random_uuid() — fails on MySQL.
              # This is seed data; the table exists. Mark as applied so deploy can proceed.
              "$NODE_BIN" "$PRISMA_BIN" migrate resolve \
                --applied "20260629000001_feed_raw_materials" \
                --schema "$APP_DIR/prisma/schema.prisma" 2>&1 || true
              # 20260701000000: used PostgreSQL CREATE TYPE / UUID DDL — fails on MySQL.
              # LeaveRequest table is created by 20260730000001_leave_request_mysql_fix.
              "$NODE_BIN" "$PRISMA_BIN" migrate resolve \
                --applied "20260701000000_leave_request_system" \
                --schema "$APP_DIR/prisma/schema.prisma" 2>&1 || true
              # 20260616200000: used PostgreSQL CREATE TYPE / UUID / JSONB DDL — fails on MySQL.
              # Notification/NotificationPreference/NotificationConfig tables are created by
              # 20260801025000_notification_system_mysql (IF NOT EXISTS, MySQL syntax).
              "$NODE_BIN" "$PRISMA_BIN" migrate resolve \
                --applied "20260616200000_notification_system" \
                --schema "$APP_DIR/prisma/schema.prisma" 2>&1 || true
              # 20260801030000_hr_d: first statement ALTER TABLE Notification failed because
              # Notification table didn't exist yet. Mark as rolled-back so migrate deploy
              # can re-run it now that 20260801025000_notification_system_mysql creates the table first.
              "$NODE_BIN" "$PRISMA_BIN" migrate resolve \
                --rolled-back "20260801030000_hr_d_disciplinary_grievance" \
                --schema "$APP_DIR/prisma/schema.prisma" 2>&1 || true
              echo "Blocked migrations resolved."

              if "$NODE_BIN" "$PRISMA_BIN" migrate deploy --schema "$APP_DIR/prisma/schema.prisma"; then
                echo "Migrations complete."
              else
                echo "WARNING: prisma migrate deploy failed — deploy continues."
              fi
            else
              echo "WARNING: cannot run migrations — node or prisma binary not found."
            fi

            echo "==> Killing stale API processes before restart..."
            pkill -f "apps/api/dist/main.js" 2>/dev/null \
              && echo "  Stale API processes killed." \
              || echo "  No stale API processes found."
            sleep 3

            mkdir -p $APP_DIR/tmp
            touch $APP_DIR/tmp/restart.txt
            echo "Passenger restart signalled."

            echo "==> Server diagnostics before smoke test..."
            echo "  Load avg: $(cat /proc/loadavg 2>/dev/null || uptime)"
            echo "  start.js: $([ -f $APP_DIR/start.js ] && echo EXISTS || echo MISSING)"
            echo "  api bundle: $([ -f $APP_DIR/apps/api/dist/bundle.js ] && echo EXISTS || echo MISSING)"
            echo "  Node procs: $(pgrep -ac node 2>/dev/null || echo 0)"
            echo "  Passenger log tail:"
            tail -20 $APP_DIR/log/passenger.log 2>/dev/null || echo "  (no passenger log found)"

            DOMAIN="https://jokasfarms.com"
            STATUS="000"
            echo "==> Waiting for app to come online (up to 180s)..."
            for i in $(seq 1 36); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$DOMAIN/__status" 2>/dev/null || echo "000")
              echo "  try $i/36: HTTP $STATUS"
              [ "$STATUS" = "200" ] && break
            done
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test PASSED — app is live (HTTP $STATUS)"
            else
              echo "WARNING: smoke test could not confirm HTTP 200 after 180s (got HTTP $STATUS)."
              echo "  Files were uploaded and Passenger restart was signalled."
              echo "  High server load may be delaying startup — see diagnostics above."
              echo "  Node procs now: $(pgrep -ac node 2>/dev/null || echo 0)"
              echo "  Passenger log tail:"
              tail -20 $APP_DIR/log/passenger.log 2>/dev/null || echo "  (no passenger log found)"
              echo "  The app should come online within a few minutes — check jokasfarms.com manually."
            fi
          '
          for attempt in 1 2 3; do
            ssh -p 65002 -i ~/.ssh/id_rsa -o ConnectTimeout=60 -o StrictHostKeyChecking=yes \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "$REMOTE_CMD" \
            && { echo "Deploy+restart succeeded on attempt $attempt"; break; } \
            || { echo "Attempt $attempt failed; retrying in 20s..."; sleep 20; }
          done
