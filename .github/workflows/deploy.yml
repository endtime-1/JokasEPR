name: Build & Deploy to Hostinger

on:
  push:
    # Audit C1: production is deployed by hand from `vps-migration` (see
    # infra/vps/deploy.sh), which is 50+ commits ahead of `main`. Nothing ran
    # CI on it, so every manual deploy skipped the lint/typecheck/unit/e2e
    # gate. Running the `build` job on `vps-migration` pushes restores that
    # gate. The `deploy` job stays pinned to `main` (it `if:`s on
    # `github.event_name == 'push'` AND the ref — see below), so this adds
    # validation without changing where the auto-deploy points.
    branches: [main, vps-migration]
  # H18: no trigger here ran quality checks before code merged to main — lint/
  # typecheck/unit/e2e only gated the deploy step, after the fact. A broken
  # push left main red until someone noticed. This runs the same `build` job
  # (lint/typecheck/unit/e2e/build) on every PR into main, without touching
  # the `deploy` job (see its `if: github.event_name == 'push'` below) — PRs
  # get full validation but never touch production. Branch protection in the
  # repo's GitHub settings should also require this "build" check to pass
  # before merging, but that setting lives outside this file.
  pull_request:
    branches: [main, vps-migration]
  workflow_dispatch:

# H-INFRA-6 (2026-08-11): neither job previously declared its own permissions,
# so both inherited the repository's default GITHUB_TOKEN scope rather than
# the minimum each actually needs. `build` runs `pnpm install`, which executes
# arbitrary third-party postinstall scripts — pinning the token to read-only
# here means a compromised dependency gets a read-only token, not whatever the
# repo's default happens to be. Neither job needs to write anything back to
# GitHub (no PR comments, no releases, no packages), so contents: read is
# sufficient everywhere.
permissions:
  contents: read

jobs:
  # ── Job 1: build on GitHub-hosted runner (plenty of RAM, fast disk) ──────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install all dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @jokas/db prisma:generate

      - name: Build shared package
        run: pnpm --filter @jokas/shared build

      # ── Quality gate ────────────────────────────────────────────────────────
      # Previously nothing here stopped a broken build from deploying — a build
      # that compiled but was logically wrong (failing tests, type errors) would
      # ship straight to production. Fail the job (and therefore skip the deploy
      # job, since it `needs: build`) before any bundling/deploy work happens.
      - name: Lint & typecheck (shared, api, web, storefront)
        run: |
          pnpm --filter @jokas/shared lint
          pnpm --filter @jokas/api lint
          pnpm --filter @jokas/web lint
          pnpm --filter @jokas/storefront lint

      - name: API unit tests
        run: pnpm --filter @jokas/api test

      - name: API e2e tests
        run: pnpm --filter @jokas/api test:e2e

      - name: Build API
        run: pnpm --filter @jokas/api build

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Web
        run: pnpm --filter @jokas/web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Storefront
        run: pnpm --filter @jokas/storefront build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Bundle API for deployment
        run: |
          pnpm --filter @jokas/api deploy --prod --legacy /tmp/api-deploy
          cp -r apps/api/dist /tmp/api-deploy/dist

          # pnpm deploy copies @prisma/client from the npm store (pre-generate stub).
          # Overwrite with the generated version so enums like AuditAction exist.
          for CANDIDATE in \
            "packages/db/node_modules/@prisma/client" \
            "node_modules/@prisma/client"; do
            if [ -f "$CANDIDATE/index.js" ]; then PRISMA_PKG="$CANDIDATE"; break; fi
          done
          if [ -n "$PRISMA_PKG" ]; then
            echo "Copying generated @prisma/client from $PRISMA_PKG"
            rm -rf /tmp/api-deploy/node_modules/@prisma/client
            cp -rL "$PRISMA_PKG" /tmp/api-deploy/node_modules/@prisma/client
            mkdir -p /tmp/api-deploy/dist/prisma-client
            cp -rL "$PRISMA_PKG/." /tmp/api-deploy/dist/prisma-client/
          else
            echo "ERROR: generated @prisma/client not found"; exit 1
          fi

          # Copy prisma CLI with resolved symlinks so it survives tar/extract intact.
          PRISMA_CLI_PKG=""
          for CANDIDATE in \
            "packages/db/node_modules/prisma" \
            "node_modules/prisma"; do
            if [ -f "$CANDIDATE/build/index.js" ]; then PRISMA_CLI_PKG="$CANDIDATE"; break; fi
          done
          if [ -z "$PRISMA_CLI_PKG" ]; then
            PRISMA_CLI_PKG=$(find node_modules -maxdepth 5 -name "index.js" \
              -path "*/prisma/build/index.js" 2>/dev/null \
              | grep -v "@prisma" | head -1 | xargs -I{} dirname {} | xargs -I{} dirname {})
          fi
          if [ -n "$PRISMA_CLI_PKG" ]; then
            echo "Copying prisma CLI from $PRISMA_CLI_PKG"
            rm -rf /tmp/api-deploy/node_modules/prisma
            cp -rL "$PRISMA_CLI_PKG" /tmp/api-deploy/node_modules/prisma
            printf '#!/bin/sh\nd=$(cd "$(dirname "$0")" && pwd)\nexec node "$d/../prisma/build/index.js" "$@"\n' \
              > /tmp/api-deploy/node_modules/.bin/prisma
            chmod +x /tmp/api-deploy/node_modules/.bin/prisma
            echo "prisma CLI bundled OK"
          else
            echo "WARNING: prisma CLI not found — migrations will be skipped on server"
          fi

          # Copy @prisma/engines — migration + introspection engine binaries required by the CLI
          PRISMA_ENGINES_PKG=""
          for CANDIDATE in \
            "packages/db/node_modules/@prisma/engines" \
            "node_modules/@prisma/engines"; do
            if [ -d "$CANDIDATE" ]; then PRISMA_ENGINES_PKG="$CANDIDATE"; break; fi
          done
          if [ -n "$PRISMA_ENGINES_PKG" ]; then
            echo "Copying @prisma/engines from $PRISMA_ENGINES_PKG"
            rm -rf /tmp/api-deploy/node_modules/@prisma/engines
            cp -rL "$PRISMA_ENGINES_PKG" /tmp/api-deploy/node_modules/@prisma/engines
            echo "@prisma/engines bundled OK"
          else
            echo "WARNING: @prisma/engines not found — migrations will fail on server"
          fi

          # Copy .prisma/client runtime (native query engine binary)
          PRISMA_RUNTIME=$(find . -path "*/.prisma/client" -type d 2>/dev/null \
            | grep -v ".git" | head -1)
          if [ -z "$PRISMA_RUNTIME" ]; then
            BINARY=$(find . \( -name "*rhel-openssl*" -o -name "libquery_engine*" \) \
              2>/dev/null | grep -v ".git" | head -1)
            [ -n "$BINARY" ] && PRISMA_RUNTIME=$(dirname "$BINARY")
          fi
          echo "Prisma runtime: ${PRISMA_RUNTIME:-NOT FOUND}"
          if [ -n "$PRISMA_RUNTIME" ]; then
            mkdir -p /tmp/api-deploy/node_modules/.prisma
            rm -rf /tmp/api-deploy/node_modules/.prisma/client
            cp -rL "$PRISMA_RUNTIME" /tmp/api-deploy/node_modules/.prisma/client
            mkdir -p /tmp/api-deploy/dist/prisma-runtime
            cp -rL "$PRISMA_RUNTIME/." /tmp/api-deploy/dist/prisma-runtime/
          else
            echo "ERROR: Prisma runtime not found — API will crash"; exit 1
          fi

      - name: Bundle Web for deployment
        run: |
          pnpm --filter @jokas/web deploy --prod --legacy /tmp/web-deploy
          cp -r apps/web/.next /tmp/web-deploy/.next
          cp -r apps/web/public /tmp/web-deploy/public 2>/dev/null || true
          mkdir -p /tmp/web-deploy/.next/standalone/apps/web/.next
          cp -r apps/web/.next/static /tmp/web-deploy/.next/standalone/apps/web/.next/static
          cp -r apps/web/public /tmp/web-deploy/.next/standalone/apps/web/public 2>/dev/null || true

      - name: Bundle Storefront for deployment
        run: |
          pnpm --filter @jokas/storefront deploy --prod --legacy /tmp/storefront-deploy
          cp -r apps/storefront/.next /tmp/storefront-deploy/.next
          cp -r apps/storefront/public /tmp/storefront-deploy/public 2>/dev/null || true
          mkdir -p /tmp/storefront-deploy/.next/standalone/apps/storefront/.next
          cp -r apps/storefront/.next/static /tmp/storefront-deploy/.next/standalone/apps/storefront/.next/static
          cp -r apps/storefront/public /tmp/storefront-deploy/.next/standalone/apps/storefront/public 2>/dev/null || true

      - name: Create deployment tarball
        run: |
          mkdir -p /tmp/deploy-pkg/apps
          cp -r /tmp/api-deploy /tmp/deploy-pkg/apps/api
          cp -r /tmp/web-deploy /tmp/deploy-pkg/apps/web
          cp -r /tmp/storefront-deploy /tmp/deploy-pkg/apps/storefront
          cp -r packages/db/prisma /tmp/deploy-pkg/prisma
          cp -r scripts /tmp/deploy-pkg/scripts 2>/dev/null || true
          # sync-permissions.mjs is intentionally NOT shipped — nothing invokes
          # it (see its own header comment); the real sync runs in-process via
          # permission-sync.service.ts on every API boot.
          cp ecosystem.config.js start.js package.json /tmp/deploy-pkg/
          cp web-worker-wrapper.js /tmp/deploy-pkg/ 2>/dev/null || true
          cp api-worker-wrapper.js /tmp/deploy-pkg/ 2>/dev/null || true
          cp setup-backup-crons.sh /tmp/deploy-pkg/ 2>/dev/null || true
          tar -czf /tmp/deploy.tar.gz -C /tmp/deploy-pkg .
          echo "Tarball size: $(du -sh /tmp/deploy.tar.gz | cut -f1)"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-pkg
          path: /tmp/deploy.tar.gz
          retention-days: 7

  # ── Job 2: deploy over SSH from a GitHub-hosted runner ────────────────────────
  # H26 (2026-08-11): this job used to run ON Hostinger via a self-hosted runner.
  # Hostinger applies a ~30-second PID-based lifetime limit to processes it
  # doesn't recognize as "the" Passenger-managed app (see start.js and
  # api-worker-wrapper.js for the same limit crash-looping the API) — the
  # runner's own process, or its per-step worker process, was very likely
  # getting killed mid-job, surfacing to GitHub as "lost communication with
  # the runner" / "The operation was canceled" on almost any step that ran
  # longer than ~30s (which is most of them: an 835MB artifact download alone
  # took ~39s). Moved back to the SSH-based deploy model this repo used before
  # the self-hosted runner was adopted (see git history pre commit-that-added-
  # runs-on:-self-hosted) — a GitHub-hosted runner orchestrates over SSH
  # instead of running natively on the box, so nothing here is subject to that
  # limit anymore. HOSTINGER_SSH_KEY / HOSTINGER_SSH_KNOWN_HOST / HOSTINGER_USER
  # / HOSTINGER_HOST are pre-existing repo secrets, reused as-is.
  deploy:
    needs: build
    # Audit C1: this job SSH-rsyncs to the pre-VPS Hostinger box via the
    # HOSTINGER_* secrets. Since the VPS migration, production is deployed by
    # hand (infra/vps/deploy.sh) and this job is dead weight — it must NOT run
    # automatically on a push. Kept in the file (and runnable via the manual
    # "Run workflow" button) only so the SSH-rsync tooling isn't lost; delete
    # the job entirely once you're sure it's never coming back.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # H-INFRA-6: actions: read is needed to download the artifact `build`
    # uploaded; nothing else in this job (SSH/rsync to Hostinger) touches the
    # GitHub API at all.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-pkg
          path: /tmp

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # H-INFRA-7: write-then-chmod leaves a brief window where the file is
          # created at the default (often world-readable) mode before chmod
          # narrows it. umask restricts the mode new files are created with from
          # the moment of creation, closing that window entirely rather than
          # narrowing it after the fact.
          umask 077
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.HOSTINGER_SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Connection-keeping options so rsync/ssh don't time out mid-transfer
          # or mid-migration on a slow shared-hosting link.
          cat > ~/.ssh/config << 'EOF'
          Host *
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF

      - name: Upload deployment tarball to Hostinger
        run: |
          for attempt in 1 2 3; do
            rsync -avz --partial --timeout=300 \
              -e "ssh -p 65002 -i ~/.ssh/id_rsa" \
              /tmp/deploy.tar.gz \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:/tmp/deploy.tar.gz \
              && { echo "Upload succeeded on attempt $attempt"; break; } \
              || { echo "Attempt $attempt failed; retrying in 15s..."; sleep 15; }
          done

      - name: Backup current deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            APP_DIR="$HOME/domains/jokasfarms.com/nodejs"
            if [ -d "$APP_DIR/apps/api/dist" ]; then
              rm -rf "$APP_DIR/../nodejs_prev"
              # (readiness review 2026-08-20) This used to swallow a failure
              # here with a WARNING and continue — nodejs_prev is the ENTIRE
              # rollback safety net this pipeline is built around, and its
              # absence was only ever discovered later, at the worst moment
              # (smoke test fails, rollback step then finds nothing to
              # restore). Abort loudly before touching any files, same
              # philosophy as the pre-migration DB snapshot step below.
              if cp -al "$APP_DIR" "$APP_DIR/../nodejs_prev"; then
                echo "Backup complete (hardlinks)."
              else
                echo "::error::Backup of the current deploy failed -- aborting before extracting/swapping any files. Without nodejs_prev, a bad deploy would have no fast rollback path. Check disk space (du -sh ~) and filesystem health on the host, then re-run the deploy."
                exit 1
              fi
            else
              echo "No existing deploy to back up."
            fi

      - name: Extract files to APP_DIR
        # H-INFRA-3 (2026-08-11): previously extracted straight into the
        # live, currently-serving APP_DIR (tar -xzf ... -C "$APP_DIR") — a
        # truncated transfer or a disk-full condition mid-extraction left a
        # mix of old and new files under a still-running process, with the
        # multi-second extraction window fully exposed. Now extracts into a
        # staging directory first and swaps it into place with two `mv`s,
        # which on the same filesystem are near-instant metadata operations
        # — the live-corruption window shrinks from "the whole extraction"
        # to "two renames." uploads/ and .env don't come from the deploy
        # tarball at all (uploads/ accumulates on the live server between
        # deploys — see the uploaded-files backup step's own comment; .env
        # gets read by the next step before being rewritten) — both are
        # explicitly carried over into the staging dir before the swap, or
        # the swap would silently delete them.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            APP_DIR="$HOME/domains/jokasfarms.com/nodejs"
            STAGE_DIR="$APP_DIR.new"
            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR"
            tar -xzf /tmp/deploy.tar.gz -C "$STAGE_DIR"
            rm -f /tmp/deploy.tar.gz

            if [ ! -f "$STAGE_DIR/start.js" ]; then
              echo "ERROR: extraction produced no start.js — aborting before touching the live app."
              rm -rf "$STAGE_DIR"
              exit 1
            fi

            if [ -d "$APP_DIR/apps/api/uploads" ]; then
              mkdir -p "$STAGE_DIR/apps/api"
              cp -a "$APP_DIR/apps/api/uploads" "$STAGE_DIR/apps/api/uploads"
            fi
            if [ -f "$APP_DIR/.env" ]; then
              cp -a "$APP_DIR/.env" "$STAGE_DIR/.env"
            fi

            rm -rf "$APP_DIR.old"
            if [ -d "$APP_DIR" ]; then mv "$APP_DIR" "$APP_DIR.old"; fi
            mv "$STAGE_DIR" "$APP_DIR"
            rm -rf "$APP_DIR.old"

            echo "Extraction complete (atomic swap)."
            echo "  api dist: $([ -f "$APP_DIR/apps/api/dist/main.js" ] || [ -f "$APP_DIR/apps/api/dist/bundle.js" ] && echo EXISTS || echo MISSING)"
            echo "  start.js: $([ -f "$APP_DIR/start.js" ] && echo EXISTS || echo MISSING)"
            echo "  uploads preserved: $([ -d "$APP_DIR/apps/api/uploads" ] && echo YES || echo "none existed")"

      - name: Patch DATABASE_URL with connection pool limit
        # (readiness review 2026-08-20) This writes connection_limit=10 into
        # .env, but start.js — the only thing that actually launches the app
        # — never loads .env itself; it only reads whatever process.env
        # Passenger already handed it (see start.js's own DATABASE_URL
        # patching, right after the ports-clear log line). Live /__status
        # output confirmed this step's write isn't reaching the running
        # process: start.js's fallback of 5 was firing, not this step's 10.
        # start.js's fallback has been raised to 10 to match what this step
        # always intended, which is the real fix — but this step itself may
        # still be dead weight (either Passenger never sources this .env at
        # all, or the SSH write is silently failing). Worth confirming via
        # hPanel's own Node.js app environment-variable config before
        # trusting this step for anything else in the future.
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          envs: DATABASE_URL
          script_stop: true
          script: |
            APP_DIR="$HOME/domains/jokasfarms.com/nodejs"
            ENV_FILE="$APP_DIR/.env"
            # Determine the URL to write — prefer the secret, fall back to existing .env
            if [ -n "$DATABASE_URL" ]; then
              DB_URL="$DATABASE_URL"
            elif [ -f "$ENV_FILE" ]; then
              DB_URL=$(grep '^DATABASE_URL=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            fi
            if [ -n "$DB_URL" ]; then
              # Strip any existing pool params so we always write the correct values
              DB_URL=$(echo "$DB_URL" | sed 's/[&?]connection_limit=[^&]*//g; s/[&?]pool_timeout=[^&]*//g')
              # Append connection_limit=10 and pool_timeout=30
              # 10 connections: enough for concurrent page loads (typically 3-5 simultaneous calls)
              # pool_timeout=30s: prevents premature "pool exhausted" errors under burst traffic
              if echo "$DB_URL" | grep -q "?"; then
                DB_URL="${DB_URL}&connection_limit=10&pool_timeout=30"
              else
                DB_URL="${DB_URL}?connection_limit=10&pool_timeout=30"
              fi
              # Write/update the DATABASE_URL line in .env. NOT via `sed -i s|...|...|` —
              # DB_URL always contains literal `&` (connection_limit=10&pool_timeout=30),
              # and `&` in a sed replacement means "insert the matched text", not a literal
              # ampersand. That silently corrupted this file with repeated fragments of the
              # old line on every past deploy. grep -v + append has no replacement-text
              # special characters to worry about.
              if [ -f "$ENV_FILE" ]; then
                grep -v '^DATABASE_URL=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
                echo "DATABASE_URL=${DB_URL}" >> "$ENV_FILE.tmp"
                mv "$ENV_FILE.tmp" "$ENV_FILE"
              else
                mkdir -p "$APP_DIR"
                echo "DATABASE_URL=${DB_URL}" >> "$ENV_FILE"
              fi
              echo "DATABASE_URL patched: connection_limit=10, pool_timeout=30"
            else
              echo "WARNING: no DATABASE_URL found — skipping connection pool patch"
            fi

      - name: Run database migrations
        # REVERTED 2026-08-05 back to the hand-rolled runner. `prisma migrate deploy`
        # was tried instead (see git history / project memory for the full story) but
        # hangs indefinitely on this host: its `diagnoseMigrationHistory` RPC call
        # ships the full SQL text of every migration (29 files, several large) to the
        # schema-engine subprocess over a stdio pipe, and that appears to deadlock —
        # both processes sit at ~0% CPU with zero open network connections, and it
        # never resolves even after 20+ minutes. Confirmed reproducible with a
        # completely clean reinstall of prisma@6.19.3, so it's not a corrupted-install
        # issue. The auto-rollback below correctly recovered production when this was
        # hit live. Reverting to the proven-reliable mechanism until the hang is
        # root-caused separately (not blocking regular deploys on it).
        #
        # H-INFRA-1/CRITICAL (2026-08-11): two gaps fixed together. (1) A
        # failing migration.sql file used to just be counted while the loop
        # moved on to try later migrations that may depend on the failed
        # one's schema change — cascading failures instead of stopping
        # cleanly. Now stops at the first failure. (2) The auto-rollback
        # further down in this job only ever restores application CODE via
        # rsync — it has never touched the database. If a migration fails
        # partway through (MySQL DDL auto-commits per statement, so a
        # multi-statement file can leave some of its statements already
        # applied), the "rolled back" previous app version would then be
        # running against a schema it was never written for, with nothing
        # about the rollback indicating that risk. This step now takes a
        # fresh mysqldump snapshot immediately before running any migration
        # — and aborts loudly, before touching the schema, if that snapshot
        # itself fails — so a verified-just-now backup always exists to
        # manually restore from if something goes wrong. The failure
        # message below points straight at it.
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          envs: DATABASE_URL
          command_timeout: 15m
          script_stop: true
          script: |
            APP_DIR="$HOME/domains/jokasfarms.com/nodejs"
            MIGRATIONS_DIR="$APP_DIR/prisma/migrations"

            # Prefer the GitHub secret; fall back to the on-disk .env for local runner runs.
            # Read as plain text, NOT `source`/`.` — DATABASE_URL's query string contains
            # unescaped `&` (connect_timeout=30&connection_limit=5&...), and sourcing an
            # unquoted `VAR=value&` line makes bash treat `&` as a background-job operator,
            # silently truncating/backgrounding the assignment instead of setting it.
            if [ -z "$DATABASE_URL" ] && [ -f "$APP_DIR/.env" ]; then
              DATABASE_URL=$(grep '^DATABASE_URL=' "$APP_DIR/.env" | head -1 | cut -d= -f2-)
            fi

            if [ -z "$DATABASE_URL" ]; then
              echo "WARNING: DATABASE_URL not set — skipping migrations"; exit 0
            fi

            # Parse mysql://user:pass@host:port/dbname in pure bash (no heredocs, no Python).
            # %@* removes shortest suffix starting with @, so passwords containing @ work.
            _u="${DATABASE_URL#mysql://}"
            DB_USER="${_u%%:*}"
            _ap="${_u#*:}"
            DB_PASS="${_ap%@*}"
            _hp="${_ap##*@}"
            DB_HOST="${_hp%%[:/*]*}"
            _ah="${_hp#"$DB_HOST"}"
            case "$_ah" in :*) DB_PORT="${_ah#:}"; DB_PORT="${DB_PORT%%/*}" ;; *) DB_PORT="3306" ;; esac
            DB_NAME="${_hp#*/}"; DB_NAME="${DB_NAME%%[?#]*}"

            # Write options file — keeps credentials out of process args and logs.
            # H-INFRA-7: umask closes the write-then-chmod race window (see
            # "Setup SSH key" step's comment for the full reasoning) — the file
            # is created at 600 from the start instead of narrowed after.
            umask 077
            printf '[client]\nhost=%s\nport=%s\nuser=%s\npassword=%s\ndatabase=%s\n' \
              "$DB_HOST" "$DB_PORT" "$DB_USER" "$DB_PASS" "$DB_NAME" > /tmp/deploy-my.cnf
            chmod 600 /tmp/deploy-my.cnf
            MYSQL="mysql --defaults-file=/tmp/deploy-my.cnf --batch --silent"
            echo "DB: $DB_USER@$DB_HOST:$DB_PORT/$DB_NAME"

            if ! $MYSQL -e "SELECT 1" > /dev/null 2>&1; then
              echo "WARNING: cannot connect to database — skipping migrations"
              rm -f /tmp/deploy-my.cnf; exit 0
            fi
            echo "Database connection OK"

            # Pre-migration safety snapshot — see the H-INFRA-1 comment above
            # the `uses:` line. Aborts before touching the schema if the
            # snapshot itself fails, rather than proceeding with no safety net.
            echo "--- Taking pre-migration snapshot ---"
            mkdir -p "$HOME/jokas-db-backups"
            SNAPSHOT_FILE="$HOME/jokas-db-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            if mysqldump --defaults-file=/tmp/deploy-my.cnf --single-transaction --routines "$DB_NAME" 2>/tmp/deploy-snapshot-err.log | gzip > "$SNAPSHOT_FILE" && [ -s "$SNAPSHOT_FILE" ]; then
              echo "Pre-migration snapshot OK: $SNAPSHOT_FILE ($(du -h "$SNAPSHOT_FILE" 2>/dev/null | cut -f1))"
              # Keep the 5 most recent pre-deploy snapshots only — these are a
              # short-lived safety net for THIS deploy, not the daily backup
              # (which has its own 7-day retention via setup-backup-crons.sh).
              ls -1t "$HOME/jokas-db-backups"/pre-deploy-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
            else
              echo "ERROR: pre-migration snapshot failed — aborting before touching the schema."
              cat /tmp/deploy-snapshot-err.log 2>/dev/null || true
              rm -f /tmp/deploy-my.cnf /tmp/deploy-snapshot-err.log "$SNAPSHOT_FILE"
              exit 1
            fi
            rm -f /tmp/deploy-snapshot-err.log

            # Create Prisma migration-tracking table if it does not yet exist.
            # Written as a single -e string to avoid YAML-breaking heredocs.
            $MYSQL -e "CREATE TABLE IF NOT EXISTS \`_prisma_migrations\` (\`id\` varchar(36) NOT NULL,\`checksum\` varchar(64) NOT NULL DEFAULT '',\`finished_at\` datetime(3) DEFAULT NULL,\`migration_name\` varchar(255) NOT NULL,\`logs\` text DEFAULT NULL,\`rolled_back_at\` datetime(3) DEFAULT NULL,\`started_at\` datetime(3) NOT NULL DEFAULT current_timestamp(3),\`applied_steps_count\` int NOT NULL DEFAULT 0,PRIMARY KEY (\`id\`),UNIQUE KEY \`_prisma_migrations_migration_name_key\` (\`migration_name\`)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"

            # High (DB stability audit, 2026-08-16): the seed block just below
            # unconditionally marks 14 foundational migrations as "already
            # applied" — correct for the actual prod DB this pipeline has
            # always run against, but silently wrong on a genuinely fresh
            # database: the loop further down would then skip those 14 files
            # (marked done) and run only the LATER migrations against tables
            # that were never created, producing a broken half-schema with no
            # error. Worse, several of those early migration.sql files predate
            # the Postgres→MySQL schema switch (see
            # project_prisma_schema_consolidation memory) and contain
            # Postgres-only DDL (`CREATE SCHEMA "public"`, `CREATE TYPE ...
            # AS ENUM`) that can't even run against MySQL — so "just let the
            # loop run every file" is not a safe fix here, only a louder
            # failure is. `Company` is the tenant root every later table
            # depends on, created by the very first real migration — its
            # absence is a reliable signal this database has never been
            # bootstrapped at all. Fail loudly and point at the verified
            # restore-from-backup path (scripts/verify-backup-restore.sh)
            # rather than silently seeding fake "already applied" markers
            # over an empty schema.
            HAS_COMPANY_TABLE=$($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='Company';" 2>/dev/null || echo "0")
            if [ "$HAS_COMPANY_TABLE" = "0" ]; then
              echo "ERROR: database '$DB_NAME' has no Company table — this looks like a genuinely fresh/empty database."
              echo "This pipeline's migration runner assumes an existing, already-bootstrapped schema and cannot"
              echo "safely initialize one from scratch (the earliest migration files predate the Postgres->MySQL"
              echo "schema switch and are not valid MySQL DDL). Restore from the most recent backup instead —"
              echo "see scripts/verify-backup-restore.sh for the verified restore procedure — then re-run this deploy."
              rm -f /tmp/deploy-my.cnf
              exit 1
            fi

            # NOTE: as of 2026-08-05 every migration through 20260804000000 already has
            # a REAL checksum recorded (via scripts/reconcile-migration-history.sh, run
            # once by hand) instead of the historical placeholder ''. This seed block is
            # kept only as a safety net for a from-scratch database; ON DUPLICATE KEY
            # UPDATE never touches the checksum column, so it will not clobber the real
            # checksums already in place.
            #
            # H31 (2026-08-11): this and the rolled-back-marker INSERT just below used to
            # be multi-line `mysql -e "...\n...\n"` calls (matching the CREATE TABLE line
            # above in intent, but spanning several physical lines). drone-ssh's transport
            # injects its own exit-code bookkeeping marker (`DRONE_SSH_PREV_COMMAND_EXIT_CODE=$?`)
            # into the stream while a multi-line quoted argument is still open — the exact
            # same quirk hit earlier with the backup-cron heredocs (see setup-backup-crons.sh's
            # own header comment) — and that marker text got fed to mysql as if it were the
            # next line of SQL, producing a 1064 syntax error on every deploy. It was silently
            # swallowed by the trailing `|| true` and never broke a deploy, but it meant these
            # two safety-net seeds were quietly never actually running. Collapsed to single-line
            # `-e` strings, same technique as the CREATE TABLE line, which never had this problem.
            $MYSQL -e "INSERT INTO \`_prisma_migrations\` (id,checksum,migration_name,started_at,finished_at,applied_steps_count) VALUES (UUID(),'','20260615143000_initial_erp_foundation',NOW(3),NOW(3),1),(UUID(),'','20260615224000_sales_customer_management',NOW(3),NOW(3),1),(UUID(),'','20260616120000_maintenance_management',NOW(3),NOW(3),1),(UUID(),'','20260616210000_mobile_sync',NOW(3),NOW(3),1),(UUID(),'','20260616230000_user_account_lockout',NOW(3),NOW(3),1),(UUID(),'','20260629000000_storefront_fields',NOW(3),NOW(3),1),(UUID(),'','20260629000001_feed_raw_materials',NOW(3),NOW(3),1),(UUID(),'','20260701000000_leave_request_system',NOW(3),NOW(3),1),(UUID(),'','20260713000000_employee_photo',NOW(3),NOW(3),1),(UUID(),'','20260616200000_notification_system',NOW(3),NOW(3),1),(UUID(),'','20260722000000_employee_user_fk',NOW(3),NOW(3),1),(UUID(),'','20260729000000_ai_alert_forecast_tables',NOW(3),NOW(3),1),(UUID(),'','20260730000000_prospect_visit_table',NOW(3),NOW(3),1),(UUID(),'','20260730000001_leave_request_mysql_fix',NOW(3),NOW(3),1) ON DUPLICATE KEY UPDATE finished_at=COALESCE(finished_at,NOW(3)),applied_steps_count=GREATEST(applied_steps_count,1);" 2>&1 || true
            # 20260801030000_hr_d_disciplinary_grievance ran against the wrong DB state
            # (Notification table didn't exist yet). Superseded by 20260801085000_hr_d_tables_recovery.
            # Mark as rolled-back so the runner skips it permanently. Single-line for the
            # same drone-ssh-transport reason as the INSERT immediately above (H31).
            #
            # Medium (DB stability audit, 2026-08-16): this line is the ONLY thing
            # preventing 20260801030000 from being attempted again and failing the
            # same way it did before — there is no other record anywhere that this
            # migration is permanently dead. If this line is ever refactored away
            # (e.g. while cleaning up old one-off seed INSERTs) without carrying its
            # semantics forward, the loop below will see 20260801030000 as pending
            # and re-run it, hitting the exact same ALTER-before-CREATE failure this
            # was written to prevent. Do not remove without confirming the rolled-back
            # marker for this migration_name is preserved some other way first.
            $MYSQL -e "INSERT INTO \`_prisma_migrations\` (id,checksum,migration_name,started_at,rolled_back_at,applied_steps_count) VALUES (UUID(),'','20260801030000_hr_d_disciplinary_grievance',NOW(3),NOW(3),0) ON DUPLICATE KEY UPDATE rolled_back_at=COALESCE(rolled_back_at,NOW(3)),applied_steps_count=0,finished_at=NULL;" 2>&1 || true

            # Pre-fetch ALL migration statuses in ONE query — eliminates per-migration
            # DB connections that trigger Hostinger's connection rate limit (ERROR 2002).
            sleep 2
            MIGS_APPLIED=$($MYSQL -N -e "SELECT COALESCE(GROUP_CONCAT(migration_name SEPARATOR '|'),'') FROM \`_prisma_migrations\` WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL AND applied_steps_count>0;" 2>/dev/null || echo "")
            sleep 1
            MIGS_ROLLEDBACK=$($MYSQL -N -e "SELECT COALESCE(GROUP_CONCAT(migration_name SEPARATOR '|'),'') FROM \`_prisma_migrations\` WHERE rolled_back_at IS NOT NULL;" 2>/dev/null || echo "")

            echo "--- Applying pending migrations ---"
            APPLIED=0; FAILED=0

            for SQL_FILE in $(find "$MIGRATIONS_DIR" -name "migration.sql" 2>/dev/null | sort); do
              MIG_NAME=$(basename "$(dirname "$SQL_FILE")")
              echo "$MIG_NAME" | grep -qE '^[0-9]{14}_' || continue

              # Pure shell match against pre-fetched pipe-separated lists — no DB connection
              case "|${MIGS_APPLIED}|"    in *"|${MIG_NAME}|"*) echo "  [ok]   $MIG_NAME"; continue ;; esac
              case "|${MIGS_ROLLEDBACK}|" in *"|${MIG_NAME}|"*) echo "  [skip] $MIG_NAME (rolled-back)"; continue ;; esac

              echo "  [run]  $MIG_NAME"
              sleep 1
              if $MYSQL < "$SQL_FILE" 2>&1; then
                sleep 1
                # (readiness review 2026-08-20) This INSERT used to be masked
                # with `|| true` — if it failed (this host's own connection
                # flakiness is exactly why every query here is separated by
                # `sleep 1` in the first place), the DDL above had genuinely
                # applied but _prisma_migrations never recorded it, so the
                # NEXT deploy would see this migration as pending and try to
                # re-run non-idempotent DDL (CREATE TABLE/ALTER TABLE ADD
                # COLUMN) against a schema that already has it — wedging
                # every future deploy with no alert. Treat it as seriously as
                # a DDL failure: stop and let the rollback path below run.
                if $MYSQL -e "INSERT INTO \`_prisma_migrations\` (id,checksum,migration_name,started_at,finished_at,applied_steps_count) VALUES (UUID(),'','$MIG_NAME',NOW(3),NOW(3),1) ON DUPLICATE KEY UPDATE finished_at=NOW(3),applied_steps_count=1,rolled_back_at=NULL;" 2>&1; then
                  echo "  [done] $MIG_NAME"
                  APPLIED=$((APPLIED + 1))
                else
                  echo "  [BOOKKEEPING-FAIL] $MIG_NAME — schema change applied, but recording it in _prisma_migrations failed."
                  echo "  The next deploy will try to re-run this migration.sql against a schema that already has it and likely fail."
                  echo "  Fix: manually run the same INSERT above over SSH before the next deploy, or see scripts/reconcile-migration-history.sh."
                  FAILED=1
                  break
                fi
              else
                echo "  [FAIL] $MIG_NAME"
                FAILED=1
                # Stop here rather than trying later files — they may depend
                # on this one's schema change, and MySQL DDL auto-commits
                # per statement, so this file itself may be partially applied.
                echo "  Stopping — later migrations may depend on this one; not attempting them."
                break
              fi
            done

            rm -f /tmp/deploy-my.cnf
            echo "Migrations: $APPLIED applied, $FAILED failed."
            if [ "$FAILED" -gt 0 ]; then
              echo "ERROR: migration '$MIG_NAME' failed — aborting deploy to prevent schema mismatch."
              echo "  A pre-migration snapshot was saved to: $SNAPSHOT_FILE"
              echo "  IMPORTANT: the automatic rollback that follows this failure only restores"
              echo "  application CODE (via rsync), never the database. If '$MIG_NAME' applied any"
              echo "  of its statements before failing, the schema is now AHEAD of what the"
              echo "  restored (previous) app version expects. Do not assume the app is fully"
              echo "  healthy just because the rollback step reports success — verify the schema"
              echo "  state manually, and restore from the snapshot above if needed."
              echo "  Check the migration SQL file and re-run the deploy after fixing it."
              exit 1
            fi

      - name: Restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            APP_DIR="$HOME/domains/jokasfarms.com/nodejs"
            # The API runs as a Worker thread inside start.js (like web and
            # storefront), not its own spawned process — there is no separate
            # "apps/api/dist/main.js" cmdline for pkill to match anymore.
            # touch restart.txt is what actually recycles it: Passenger tears
            # down and relaunches the whole start.js process, taking every
            # worker thread with it.
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"
            echo "Passenger restart signalled."

      - name: Smoke test
        run: |
          STATUS="000"
          echo "Waiting for app to come online (up to 180s)..."
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://jokasfarms.com/__status" 2>/dev/null || echo "000")
            echo "  try $i/36: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
          done
          if [ "$STATUS" = "200" ]; then
            echo "Smoke test PASSED — app is live."
          else
            echo "Passenger log:"
            # \$HOME must expand on the REMOTE box, not here — escaped so this
            # shell (running on the GitHub-hosted runner) doesn't expand it first.
            ssh -p 65002 -i ~/.ssh/id_rsa "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
              "tail -20 '\$HOME/domains/jokasfarms.com/nodejs/log/passenger.log'" 2>/dev/null || true
            echo "ERROR: app not responding after 180s (HTTP $STATUS)."
            exit 1
          fi

      - name: Roll back to previous deploy on Hostinger
        # H-INFRA-2 (2026-08-11): previously a single appleboy/ssh-action
        # attempt with no retry — if THIS SSH connection also failed
        # (transient network blip, or the box under load right after a bad
        # deploy), the rollback silently never happened, the next step was
        # skipped entirely (it only runs if this one reports success), and
        # nothing beyond a red GitHub Actions run signaled it. Converted to
        # a raw ssh call (reusing the key already staged by "Setup SSH
        # key") wrapped in the same 3-attempt retry pattern already proven
        # reliable for the tarball upload earlier in this job, and the
        # final failure message is now explicit that production may still
        # be down and needs immediate manual attention — not just a
        # generic red X for someone to eventually notice.
        if: failure()
        id: rollback_restore
        run: |
          ROLLBACK_CMD='
            APP_DIR="$HOME/domains/jokasfarms.com/nodejs"
            PREV_DIR="$APP_DIR/../nodejs_prev"
            if [ ! -d "$PREV_DIR" ]; then
              echo "::error::Smoke test failed and no nodejs_prev backup exists -- cannot auto-rollback. Manual intervention required via SSH."
              exit 1
            fi
            echo "==> Smoke test failed -- rolling back to the previous deploy..."
            rsync -a --delete "$PREV_DIR/" "$APP_DIR/"
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"
          '
          for attempt in 1 2 3; do
            if ssh -p 65002 -i ~/.ssh/id_rsa "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" "$ROLLBACK_CMD"; then
              echo "Rollback succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::Rollback attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::Rollback failed after 3 attempts -- PRODUCTION MAY STILL BE RUNNING THE BROKEN DEPLOY. Immediate manual intervention required via SSH: rsync the nodejs_prev backup back into place and touch tmp/restart.txt."
          exit 1

      # Split from the rollback step above: the ssh-action step can only run
      # bash it uploads to the box, and polling a public https:// URL doesn't
      # need to run there — kept local, same as the original Smoke test step.
      # Only runs if the restore itself actually happened (not e.g. skipped
      # because nodejs_prev didn't exist) — matches the original single-step
      # behavior, which never reached its polling loop in that case either.
      - name: Verify rollback came back online
        if: failure() && steps.rollback_restore.outcome == 'success'
        run: |
          echo "==> Waiting for the previous version to come back online (up to 120s)..."
          STATUS="000"
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://jokasfarms.com/__status" 2>/dev/null || echo "000")
            echo "  try $i/24: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
          done
          if [ "$STATUS" = "200" ]; then
            echo "::error::Deploy failed its smoke test and was auto-rolled-back to the previous version, which is now live again. Investigate the failed build before pushing again."
          else
            echo "::error::Deploy failed its smoke test AND the rollback restore isn't responding either (HTTP $STATUS) — this needs immediate manual attention via SSH (see scripts/rollback.sh)."
          fi
          exit 1

      - name: Setup backup crons
        if: always()
        # H27/H28/H29 (2026-08-11): this step's logic used to be embedded
        # directly here across 3 separate rewrites (escaped-string one-liner,
        # heredoc, single-quoted multi-line printf) — all failed identically
        # under appleboy/ssh-action's drone-ssh transport: dies silently
        # right after the first echo, immediately before a multi-line
        # if/else block, zero further output, regardless of exactly how the
        # file-writing part was quoted. The Patch-DATABASE_URL and Run-
        # migrations steps use comparable multi-line if/then constructs and
        # always succeeded, so the exact transport quirk was never
        # conclusively isolated. Moved the whole thing into
        # setup-backup-crons.sh (repo root, bundled into the deploy tarball
        # and shipped via the same rsync upload that reliably moves the
        # ~850MB tarball) instead of continuing to guess — this step is now
        # a single trivial command, sidestepping whatever drone-ssh does
        # with longer/more complex inline scripts entirely. See that file
        # for the full backup-setup logic and history.
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          envs: DATABASE_URL
          script_stop: true
          # H-INFRA-4 (2026-08-11): debug:true was only ever needed to diagnose the
          # since-fixed drone-ssh transport quirk referenced above. It prints every
          # forwarded env var as a literal `export VAR=value` line, including
          # DATABASE_URL — GitHub's secret-masking catches it today, but that's one
          # avoidable layer of exposure for a flag that's no longer doing anything
          # useful now that this step is stable. Removed.
          script: bash "$HOME/domains/jokasfarms.com/nodejs/setup-backup-crons.sh"
