# ============================================================================
# akokofeeds.com — public marketing + sales site (Next.js storefront :3002)
# ----------------------------------------------------------------------------
# A SEPARATE nginx site file on purpose: the live jokasfarms.com file has been
# rewritten in place by certbot, so don't overwrite it — add this one beside it.
#
# Install (after the DNS records point at this server):
#   sudo cp infra/vps/nginx-akokofeeds.conf /etc/nginx/sites-available/akokofeeds
#   sudo ln -sf /etc/nginx/sites-available/akokofeeds /etc/nginx/sites-enabled/akokofeeds
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d akokofeeds.com -d www.akokofeeds.com
#
# Security model: this domain is PUBLIC. Only the shop's own API routes and the
# product/logo images are forwarded to the API. Login, the ERP, admin endpoints
# and every other /api path return 404 here and stay reachable only through
# jokasfarms.com.
# ============================================================================

upstream jokas_api { server 127.0.0.1:4001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name akokofeeds.com www.akokofeeds.com;

    # One canonical host (same lesson as jokasfarms.com's www bug: a page on the
    # "other" host breaks CSP/connect-src). certbot copies this into the :443
    # block — verify it is there after running certbot.
    if ($host = www.akokofeeds.com) {
        return 301 https://akokofeeds.com$request_uri;
    }

    # Orders / contact forms only — no uploads on this domain.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ── The only API routes the public site needs ──────────────────────────
    # Longest prefix wins, so the admin routes under /public/admin are cut off
    # even though they live under the allowed /public/ prefix.
    location /api/v1/public/admin/ { return 404; }
    location /api/v1/public/        { proxy_pass http://jokas_api; }
    location /api/v1/uploads/products/ { proxy_pass http://jokas_api; }
    location /api/v1/uploads/company/  { proxy_pass http://jokas_api; }

    # Everything else under /api (auth, ERP, mobile, uploads of staff data…)
    location /api/ { return 404; }

    # ── The site itself ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://jokas_storefront;
    }
}
