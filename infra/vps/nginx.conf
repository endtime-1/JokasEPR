# ============================================================================
# Jokas ERP — nginx site config
# ----------------------------------------------------------------------------
# Install:
#   sudo cp infra/vps/nginx.conf /etc/nginx/sites-available/jokas
#   sudo ln -sf /etc/nginx/sites-available/jokas /etc/nginx/sites-enabled/jokas
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jokasfarms.com -d www.jokasfarms.com
#
# certbot rewrites this file in place to add the TLS listener + redirect.
#
# Routing: everything goes to the Next.js dashboard (:3000) EXCEPT /shop.
# The dashboard owns:
#   - the UI
#   - /api/v1/*   -> proxied to NestJS :4001 via next.config.mjs rewrites()
#   - /api/auth/* , /api/setup* -> server-side route handlers that talk to NestJS
#   - /uploads/*  -> rewritten to NestJS /api/v1/uploads/*
# Routing /api/* straight to NestJS here would bypass the auth route handlers
# (which strip/add the /v1 segment and own the cookies) — do NOT do that.
# ============================================================================

upstream jokas_web        { server 127.0.0.1:3000; keepalive 16; }
upstream jokas_storefront { server 127.0.0.1:3002; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name jokasfarms.com www.jokasfarms.com;

    # Uploaded files can be up to UPLOAD_MAX_MB (20) — allow headroom.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # ── Customer storefront (Next.js basePath: /shop) ──────────────────────
    location /shop {
        proxy_pass http://jokas_storefront;
    }

    # ── WebSocket/upgrade passthrough for the dashboard ────────────────────
    location /_next/webpack-hmr {
        proxy_pass http://jokas_web;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Everything else -> Next.js dashboard ──────────────────────────────
    location / {
        proxy_pass http://jokas_web;
    }
}
